spring.application.name=thirty-api

# Credenciales y URL de la Base de Datos (inyectadas vía variables de entorno por seguridad)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:6543/postgres?prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:postgres.ylxpcytucebvzijqyrsx}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Credenciales de Supabase Storage (inyectadas vía variables de entorno)
supabase.url=${SUPABASE_URL:https://ylxpcytucebvzijqyrsx.supabase.co}
supabase.key=${SUPABASE_KEY}

# Configuración de JPA para evitar errores de metadatos en el arranque
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Puerto din\u00E1mico para Render
server.port=${PORT:8080}